# Parameters for the paired transcriptomic analysis.
seed: 2026
reuse_checkpoints: true
# Genes with >=10 counts in >=6 progressor samples.
filter_mode: recent
min_count: 10
min_samples: 6
remove_xy: true
padj_cutoff: 0.05
lfc_cutoff: 0.5
# DESeq2 results() independent-filtering alpha.
results_alpha: 0.10
gsea_min_size_kegg: 15
gsea_min_size_hallmark: 10
gsea_max_size: 500
# fgsea settings.
gsea_eps: 1.0e-10
gsea_method: hybrid
msigdb_version: 7.5.1
tsne_perplexity: 5
png_dpi: 300
